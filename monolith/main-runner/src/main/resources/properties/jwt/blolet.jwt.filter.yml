app:
  auth:
    filter:
      exclude-paths:
        # 서버 간
        - path: "/actuator/health"
          methods: "*"
          description: "Spring Boot Actuator가 제공하는 헬스 체크 경로"
        - path: "/internal/**"
          methods: "*"
          description: "내부 API 경로"
        # Docs 등 static
        - path: /swagger-ui/**
          methods: "*"
        - path: /v3/api-docs/**
          methods: "*"
        # 일반 목적 API
        - path: /auth/signup
          methods: "*"
        - path: /auth/login
          methods: "*"
        - path: /auth/email/verification/send
          methods: "*"
        - path: /auth/email/verification/check
          methods: "*"
        - path: /auth/token/refresh
          methods: "*"
        - path: /blogs/*/ownership
          methods: "*"